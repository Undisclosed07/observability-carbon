name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm dependency update
        run: helm dependency update charts/observability-carbon

      - name: Helm lint
        run: helm lint charts/observability-carbon

      - name: Helm template (smoke render)
        run: helm template obs-carbon charts/observability-carbon > /tmp/rendered.yaml

      - name: Validate rendered YAML
        run: |
          python3 -c "import yaml,sys; list(yaml.safe_load_all(open('/tmp/rendered.yaml')))"

  python-lint:
    name: Sample-app lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r examples/sample-app/requirements.txt
          pip install ruff
      - name: Ruff
        run: ruff check examples/sample-app/

  json-validate:
    name: Validate Grafana dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          for f in charts/observability-carbon/dashboards/*.json; do
            echo "Validating $f"
            python3 -c "import json,sys; json.load(open('$f'))"
          done
